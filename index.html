<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#ff8b3d" />
    <script>
      (() => {
        const ua = navigator.userAgent;
        const isIos = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || Boolean(navigator.standalone);
        if (!isIos || !isSafari) return;

        if (isStandalone) {
          document.documentElement.classList.add('qling-ios-standalone-pwa');
        } else {
          document.documentElement.classList.add('qling-ios-safari-browser');
        }
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#fff5eb');
      })();
    </script>
    <title>Qling</title>
    <!-- Basic PWA fallbacks if icons are missing, users can rely on system defaults or we could add real paths -->
    <meta name="description" content="밤을 위로하는 익명 라디오 사연 앱">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
